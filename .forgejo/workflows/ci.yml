# SwiftPM CI on thetis (macOS host mode), on the Xcode pinned in .xcode-version
# and on the other Xcode 27 releases thetis has, then on iOS 26 and 27
# simulators. `swift test` covers the macOS side on the host. The iOS job is
# there because AVFoundation's audio encoder is stricter on iOS: mismatched
# audio formats that macOS converts silently fail there, and only there.
#
# Forgejo is the primary repo and pushes to GitHub, which ignores .forgejo/.
#
# Checkout and the toolchain steps are composite actions from sjs/actions,
# referenced by full URL so the runner fetches them from git.samhuri.net.
#
# Path filters and cancel-in-progress are here because there is exactly one Mac
# runner: doc changes shouldn't occupy it, and neither should a run that a
# newer push has already superseded. The workflow itself is linted with
# actionlint and ShellCheck in a Linux container, off the Mac runner.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".swift-version"
      - ".xcode-version"
      - ".forgejo/**"
  # No branch filter on pull requests: a stacked PR targets another PR's
  # branch rather than main, and it needs the tests just as much.
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".swift-version"
      - ".xcode-version"
      - ".forgejo/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Lint workflows
    runs-on: docker
    container:
      image: docker.io/library/ruby:4.0
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: https://git.samhuri.net/sjs/actions/checkout@v1

      - name: actionlint
        uses: https://git.samhuri.net/sjs/actions/actionlint@v1

  test:
    name: Tests (${{ matrix.xcode-name }})
    runs-on: macos-arm64
    timeout-minutes: 20
    strategy:
      # The pinned entry is the one that has to be green, and an empty
      # xcode-version is what makes the xcode action read .xcode-version and
      # check-toolchain check .swift-version with it.
      fail-fast: false
      matrix:
        include:
          - xcode-name: pinned
            xcode: ""
          - xcode-name: "27.0"
            xcode: "27.0"
          - xcode-name: "27.1"
            xcode: "27.1"
    steps:
      - name: Check out
        uses: https://git.samhuri.net/sjs/actions/checkout@v1
        with:
          require-file: Package.swift

      - name: Select Xcode
        uses: https://git.samhuri.net/sjs/actions/xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Show toolchain
        uses: https://git.samhuri.net/sjs/actions/xcode-toolchain@v1
        with:
          tools: ""

      - name: Check toolchain pins
        uses: https://git.samhuri.net/sjs/actions/check-toolchain@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      # The export tests fail with AVFoundation -11800 when two runs encode on
      # the same Mac at once, and a runner takes more than one job, so the
      # matrix entries wait their turn. Forgejo ignores max-parallel.
      - name: Run tests
        uses: https://git.samhuri.net/sjs/actions/swift-test@v1
        with:
          fail-on-warnings: "true"
          serialize: "true"

  # One build, then the tests on each simulator in turn. After the macOS tests
  # rather than beside them: two host runs encoding at once fail with -11800,
  # and whether a simulator run collides with a host run hasn't been tried. On
  # any outcome but a cancel, so a macOS failure doesn't hide the iOS result.
  ios:
    name: Tests (iOS)
    needs: test
    if: ${{ !cancelled() }}
    # thetis's simulator runner, which takes one job at a time across every
    # repo.
    runs-on: ios-simulator
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: https://git.samhuri.net/sjs/actions/checkout@v1
        with:
          require-file: Package.swift

      - name: Select Xcode
        uses: https://git.samhuri.net/sjs/actions/xcode@v1

      - name: Show toolchain
        uses: https://git.samhuri.net/sjs/actions/xcode-toolchain@v1
        with:
          tools: xcsift
          simulators: true

      - name: Check toolchain pins
        uses: https://git.samhuri.net/sjs/actions/check-toolchain@v1

      - name: Pick the iOS 26 simulator
        id: ios26
        uses: https://git.samhuri.net/sjs/actions/simulator@v1
        with:
          ios-version: "26"

      - name: Pick the iOS 27 simulator
        id: ios27
        uses: https://git.samhuri.net/sjs/actions/simulator@v1
        with:
          ios-version: "27"

      # No project or workspace: the action builds the package itself.
      - name: Run tests
        uses: https://git.samhuri.net/sjs/actions/xcodebuild@v1
        with:
          action: test
          scheme: SJSAssetExportSession
          destination: |
            ${{ steps.ios26.outputs.destination }}
            ${{ steps.ios27.outputs.destination }}
          fail-on-warnings: "true"
