# Benchmarks on a Mac runner. The job benchmarks the library before and after a
# change, on the same machine in the same job, and fails when the change
# regressed past the thresholds set in Benchmarks/Benchmarks/ExportBenchmarks.
# Benchmarks/compare does the work; see it for how a busy machine is handled.
#
# It only runs by hand, comparing a branch with main or any other ref. Only
# instruction counts and peak memory can fail it; for timings, run
# Benchmarks/compare on a quiet machine.

name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      base:
        description: Branch, tag or commit to compare with
        default: main

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare with base
    runs-on: macos-arm64
    timeout-minutes: 45
    steps:
      - name: Check out the change
        uses: https://git.samhuri.net/sjs/actions/checkout@v1
        with:
          path: change
          require-file: Benchmarks/Package.swift

      - name: Check out the base
        uses: https://git.samhuri.net/sjs/actions/checkout@v1
        with:
          path: base
          ref: ${{ inputs.base }}
          require-file: Package.swift

      - name: Select Xcode
        uses: https://git.samhuri.net/sjs/actions/xcode@v1
        with:
          working-directory: change

      # Downloads only what isn't already in the runner's cache directory.
      - name: Fetch media
        run: change/Benchmarks/fetch-media

      - name: Compare
        run: change/Benchmarks/compare base
